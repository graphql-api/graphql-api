name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Verify
        run: pnpm check

      - name: Capture lockfile
        uses: actions/upload-artifact@v7
        with:
          path: pnpm-lock.yaml
          archive: false
